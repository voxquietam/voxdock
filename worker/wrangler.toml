name = "voxdock-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[triggers]
# Refresh Unseen anomaly engine every 2 hours (respects CelesTrak & upstream limits)
crons = ["0 */2 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "voxdock"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
DEFAULT_LAT = "46.48"
DEFAULT_LON = "30.72"
DEFAULT_CITY = "Odesa"
DEFAULT_OBLAST_UID = "18"
